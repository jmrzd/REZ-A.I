name: REZ serverless brain checks
on:
  push:
    paths:
      - 'frontend/app/rez-serverless-agent.ts'
      - 'frontend/app/api/rez-agent/**'
      - 'frontend/tests/rez-agent-route.test.ts'
      - 'frontend/app/page.tsx'
      - '.github/workflows/rez-agent-checks.yml'
  pull_request:
    paths:
      - 'frontend/app/rez-serverless-agent.ts'
      - 'frontend/app/api/rez-agent/**'
      - 'frontend/tests/rez-agent-route.test.ts'
      - 'frontend/app/page.tsx'
      - '.github/workflows/rez-agent-checks.yml'
permissions:
  contents: read
jobs:
  serverless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate REZ Avançado without third-party runtime
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx tsx --test tests/rez-agent-route.test.ts
