name: REZ A.I - tests and build
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and contract tests (no external paid API)
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Independent AI local security and retrieval tests
        run: npm test
      - name: Build Next.js production
        run: npm run build

  cloud-brain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker build dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck independent brain service
        run: npm run typecheck
      - name: Bundle Cloudflare Worker without deploying
        run: npx wrangler deploy --dry-run --outdir ./dist
